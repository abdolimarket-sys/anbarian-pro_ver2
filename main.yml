name: Build Anbarin APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.ANBARIN_KEYSTORE_BASE64 != '' && secrets.ANBARIN_KEYSTORE_PASSWORD != '' && secrets.ANBARIN_KEY_ALIAS != '' && secrets.ANBARIN_KEY_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify release metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const gradle = fs.readFileSync('android/app/build.gradle', 'utf8');
          const expectedId = 'com.anbarian.app';
          const versionCode = Number(gradle.match(/versionCode\\s+(\\d+)/)?.[1]);
          const versionName = gradle.match(/versionName\\s+"([^"]+)"/)?.[1];
          if (!pkg.version || pkg.version !== lock.version || pkg.version !== lock.packages?.['']?.version) {
            throw new Error('package.json and package-lock.json versions do not match');
          }
          if (versionName !== pkg.version || !Number.isInteger(versionCode) || versionCode < 1) {
            throw new Error('Android versionName/versionCode metadata is inconsistent');
          }
          if (!gradle.includes(`applicationId "${expectedId}"`) || !gradle.includes(`namespace "${expectedId}"`)) {
            throw new Error('Android applicationId/namespace changed unexpectedly');
          }
          console.log(`Verified ${pkg.version} (${versionCode}) ${expectedId}`);
          NODE

      - name: Install dependencies and run smoke tests
        run: |
          npm ci --registry https://registry.npmjs.org/
          npm test

      - name: Build web
        run: |
          npm run build
          test -f dist/index.html

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools (sdkmanager) were not found."
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/tmp/lic.txt || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare persistent release signing key
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          ANBARIN_KEYSTORE_BASE64: ${{ secrets.ANBARIN_KEYSTORE_BASE64 }}
          ANBARIN_KEYSTORE_PASSWORD: ${{ secrets.ANBARIN_KEYSTORE_PASSWORD }}
          ANBARIN_KEY_ALIAS: ${{ secrets.ANBARIN_KEY_ALIAS }}
          ANBARIN_KEY_PASSWORD: ${{ secrets.ANBARIN_KEY_PASSWORD }}
        run: |
          echo "$ANBARIN_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/anbarin-release.jks"
          echo "ANBARIN_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/anbarin-release.jks" >> "$GITHUB_ENV"
          echo "ANBARIN_KEYSTORE_PASSWORD=$ANBARIN_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANBARIN_KEY_ALIAS=$ANBARIN_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANBARIN_KEY_PASSWORD=$ANBARIN_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload signed release APK
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: anbarin-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Verify APK outputs and create checksums
        run: |
          set -euo pipefail
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -n "$DEBUG_APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort | tail -n 1)
          test -n "$AAPT"
          "$AAPT" dump badging "$DEBUG_APK" | grep -F "package: name='com.anbarian.app'"
          mkdir -p build-verification
          sha256sum "$DEBUG_APK" > build-verification/debug-apk.sha256
          if [ -d android/app/build/outputs/apk/release ]; then
            RELEASE_APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)
            if [ -n "$RELEASE_APK" ]; then
              "$AAPT" dump badging "$RELEASE_APK" | grep -F "package: name='com.anbarian.app'"
              sha256sum "$RELEASE_APK" > build-verification/release-apk.sha256
            fi
          fi

      - name: Upload build verification checksums
        uses: actions/upload-artifact@v4
        with:
          name: anbarin-build-checksums
          path: build-verification/*.sha256
          if-no-files-found: error

      - name: Upload debug APK (test only; not for customer updates)
        uses: actions/upload-artifact@v4
        with:
          name: anbarin-debug-apk-test-only
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
